name: Deploy Claro Helper to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit-test message templates
        run: bun test src/lib/templates.test.ts
      - name: Build static SPA for GitHub Pages
        run: bunx vite build --config vite.pages.config.ts
      - name: Install Playwright for interactive browser validation
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Smoke-test the deployed SPA locally
        shell: bash
        run: |
          bunx vite preview --config vite.pages.config.ts --host 127.0.0.1 --port 4173 > /tmp/claro-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/claro-helper/ > /dev/null; then break; fi
            sleep 1
          done
          npx playwright test pages/smoke.spec.cjs --reporter=line --workers=1
      - name: Verify the generated static website
        shell: bash
        run: |
          test -f dist/index.html || {
            echo "::error::Missing dist/index.html. Pages needs a static SPA."
            find .output -maxdepth 4 -type f | head -80
            exit 1
          }
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
